# WORLD MONITOR CONFIG

# ───────────────────────────────────────────────────────────────────────────────
# SERVER & CONFIG SETTINGS
# ───────────────────────────────────────────────────────────────────────────────
[server]
# Port for the web interface
port = 8080

# Request timeout for feed fetching (seconds)
timeout = 15

# Maximum items to display per category
per_category = 5

# ───────────────────────────────────────────────────────────────────────────────
# LLAMA SERVER SETTINGS
# ───────────────────────────────────────────────────────────────────────────────
[llama]
# Path to llama-server binary (auto-detected if empty)
# Examples: "./llama-server", "/usr/local/bin/llama-server", "models/llama-server"
binary = ""

# Port for the llama-server API (internal, not exposed)
port = 8079

# Number of parallel inference slots
parallel_slots = 1

# Startup timeout in seconds (large models need more time)
startup_timeout = 120

# ───────────────────────────────────────────────────────────────────────────────
# BUDGET / RATE LIMITS
# ───────────────────────────────────────────────────────────────────────────────
[limits]
# Maximum tokens per session (0 = unlimited)
session_tokens = 0

# Maximum tokens per day (0 = unlimited)
daily_tokens = 0

# ───────────────────────────────────────────────────────────────────────────────
# DEFAULT MODEL SETTINGS
# ───────────────────────────────────────────────────────────────────────────────
# These are used when a model isn't in the [[models]] list below,
# or as fallbacks when model-specific values aren't set.

[defaults]
# Model to load at startup (filename in models_dir, empty = first available)
model = ""

# Directory containing .gguf model files
models_dir = "models"

# GPU layers to offload (-1 or 99 = all layers)
gpu_layers = -1

# Context window size in tokens
context_size = 4096

# Enable flash attention
flash_attention = true

temperature = 0.7
top_k = 40
top_p = 0.9
repeat_penalty = 1.1

# ───────────────────────────────────────────────────────────────────────────────
# CATEGORIES
# ───────────────────────────────────────────────────────────────────────────────
# Define display order and icons for feed categories.
# Feeds reference these by name.

[[categories]]
name = "Geopolitics"
icon = "🌍"
color = "#4a9eff"

[[categories]]
name = "Tech & AI"
icon = "🤖"
color = "#a78bfa"

[[categories]]
name = "Markets"
icon = "📈"
color = "#34d399"

[[categories]]
name = "Science"
icon = "🔬"
color = "#fbbf24"

[[categories]]
name = "Security"
icon = "🔒"
color = "#f87171"

[[categories]]
name = "Society"
icon = "🏛"
color = "#fb923c"

